<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile</title><link rel="stylesheet" href="style.css"></head>
<body>
<p id="error" role="alert" hidden></p>
<section id="connection">
 <article><h2>Mobile 服务</h2><p id="summary"></p><div class="actions">
  <button class="primary" data-action="__runtime.start">启动</button><button data-action="__runtime.stop">停止</button>
  <button data-action="open-web">打开 Web</button><button data-action="copy-url">复制连接链接</button>
 </div></article>
 <article><h2>手机连接</h2><p>手机使用下方同一个入口连接，应用设置后切换后端连接方式。</p>
  <details id="qr" open><summary>显示连接二维码</summary><img id="qr-image" alt="Mobile 连接二维码"><p id="address"></p><small>二维码包含访问口令，请仅分享给可信设备。</small></details>
 </article>
</section>
<section id="settings"><form id="config">
 <article><h2>连接方式</h2>
  <label>连接模式<select name="mode"><option value="cdp">共享 Desktop（CDP）</option><option value="native">本机原生 API</option><option value="managed">托管 app-server</option><option value="external">外部 app-server</option></select></label>
  <p id="mode-description"></p>
  <div data-modes="cdp native"><p id="desktop"></p><small>桌面应用路径和 CDP 端口由启动器的桌面设置管理。</small></div>
  <div data-modes="managed" hidden><label>托管服务内部端口<input name="appServerPort" type="number" min="1" max="65535"></label><small>此端口用于内部连接，手机仍使用下方 Web 端口。</small><p id="cli-path"></p></div>
  <div data-modes="external" hidden><label>上游服务地址<input name="upstreamUrl" type="url" placeholder="ws://127.0.0.1:18765"></label><small>连接本机已经运行的 app-server。</small></div>
 </article>
 <article><h2>网络与访问</h2>
  <label>监听范围<select name="host"><option value="0.0.0.0">局域网设备可访问</option><option value="127.0.0.1">仅本机</option></select></label>
  <label>Web 端口<input name="gatewayPort" type="number" min="1" max="65535" required></label>
  <label>访问口令<input name="token" type="password" autocomplete="new-password" placeholder="留空保留现有口令"></label>
  <p id="apply-hint"></p><button id="apply-config" class="primary" type="submit">应用连接设置</button>
 </article>
</form></section>
<script src="app.js?v=mobile-unified-modes-20261105"></script>
</body></html>
