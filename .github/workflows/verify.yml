name: Verify plugin catalog and packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node --input-type=module -e "import {validateCatalog} from './scripts/catalog.mjs'; import {readFileSync} from 'node:fs'; validateCatalog(JSON.parse(readFileSync('plugins.json')))"
